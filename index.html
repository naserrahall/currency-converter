<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>محول العملات السريع</title>
  <style>
    :root {
      --bg:#f3f4f6; --card:#ffffff; --text:#111827; --muted:#6b7280;
      --border:#e5e7eb; --accent:#111827; --green:#16a34a;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:var(--bg); color:var(--text);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .app{width:min(560px,100%)}
    h1{font-size:28px;margin:0 0 8px;text-align:center}
    .sub{color:var(--muted);text-align:center;margin:0 0 20px;line-height:1.6}
    .card{
      background:var(--card); border-radius:24px; padding:18px;
      box-shadow:0 12px 35px rgba(0,0,0,.08);
    }
    .row{
      display:grid; grid-template-columns:1fr 120px; gap:10px; margin:12px 0;
    }
    input, select, button{
      font:inherit; border:1px solid var(--border); border-radius:16px; background:#fff;
    }
    input{
      width:100%; padding:18px 16px; font-size:25px; direction:ltr; text-align:left;
      outline:none;
    }
    input:focus{border-color:#9ca3af; box-shadow:0 0 0 4px rgba(17,24,39,.05)}
    select{
      padding:0 12px; font-weight:700; font-size:17px; direction:ltr;
    }
    .status{
      margin-top:14px; padding:12px 14px; background:#f9fafb; border-radius:14px;
      color:var(--muted); font-size:13px; line-height:1.6; text-align:center;
    }
    .ok{color:var(--green);font-weight:700}
    button{
      width:100%; margin-top:12px; padding:14px; font-weight:700; cursor:pointer;
    }
    .credit{font-size:11px;text-align:center;margin-top:12px;color:var(--muted)}
    .credit a{color:inherit}
    @media (max-width:430px){
      body{padding:14px}
      h1{font-size:24px}
      .card{padding:14px;border-radius:20px}
      .row{grid-template-columns:1fr 100px}
      input{font-size:23px;padding:16px 14px}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>محول العملات</h1>
    <p class="sub">اكتب المبلغ في أي خانة، وستتحدث الخانتان الأخريان فورًا أثناء الكتابة.</p>

    <section class="card">
      <div class="row">
        <input id="amount1" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="المبلغ الأول">
        <select id="currency1" aria-label="العملة الأولى"></select>
      </div>
      <div class="row">
        <input id="amount2" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="المبلغ الثاني">
        <select id="currency2" aria-label="العملة الثانية"></select>
      </div>
      <div class="row">
        <input id="amount3" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="المبلغ الثالث">
        <select id="currency3" aria-label="العملة الثالثة"></select>
      </div>

      <div id="status" class="status">جاري تحميل أسعار الصرف…</div>
      <button id="refresh">تحديث أسعار الصرف</button>
      <div class="credit">
        Rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Exchange Rate API</a>
      </div>
    </section>
  </main>

<script>
(() => {
  const API = 'https://open.er-api.com/v6/latest/USD';
  const ids = [1,2,3];
  const defaults = ['USD','JOD','EGP'];
  const inputs = ids.map(i => document.getElementById(`amount${i}`));
  const selects = ids.map(i => document.getElementById(`currency${i}`));
  const status = document.getElementById('status');
  const refreshBtn = document.getElementById('refresh');

  let rates = null;
  let activeIndex = 0;
  let syncing = false;

  const fallbackCodes = ['USD','JOD','EGP','EUR','GBP','SAR','AED','QAR','KWD','BHD','TRY'];

  function setStatus(text, ok=false){
    status.innerHTML = ok ? `<span class="ok">${text}</span>` : text;
  }

  function fillSelects(codes){
    selects.forEach((select, i) => {
      const current = select.value || defaults[i];
      select.innerHTML = '';
      codes.forEach(code => {
        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = code;
        select.appendChild(opt);
      });
      select.value = codes.includes(current) ? current : (codes.includes(defaults[i]) ? defaults[i] : codes[0]);
    });
  }

  function parseNum(v){
    if (!v) return NaN;
    return Number(String(v).replace(',', '.'));
  }

  function formatNum(n){
    if (!Number.isFinite(n)) return '';
    const abs = Math.abs(n);
    const max = abs >= 1000 ? 2 : abs >= 1 ? 3 : 4;
    return n.toLocaleString('en-US', {
      useGrouping:false,
      maximumFractionDigits:max
    });
  }

  function convertFrom(index){
    if (syncing || !rates) return;
    activeIndex = index;
    const sourceAmount = parseNum(inputs[index].value);

    syncing = true;
    if (!Number.isFinite(sourceAmount)) {
      inputs.forEach((el, i) => { if (i !== index) el.value = ''; });
      syncing = false;
      return;
    }

    const sourceCode = selects[index].value;
    const sourceRate = rates[sourceCode];
    if (!sourceRate) {
      syncing = false;
      return;
    }

    const amountInUSD = sourceAmount / sourceRate;

    inputs.forEach((el, i) => {
      if (i === index) return;
      const targetCode = selects[i].value;
      const targetRate = rates[targetCode];
      el.value = targetRate ? formatNum(amountInUSD * targetRate) : '';
    });
    syncing = false;
  }

  async function loadRates(force=false){
    if (!force) {
      try {
        const cached = JSON.parse(localStorage.getItem('currencyRatesCache') || 'null');
        if (cached?.rates) {
          rates = cached.rates;
          fillSelects(Object.keys(rates).sort());
          if (cached.updated) setStatus(`آخر تحديث محفوظ: ${new Date(cached.updated).toLocaleString('ar')}`, true);
        } else {
          fillSelects(fallbackCodes);
        }
      } catch {
        fillSelects(fallbackCodes);
      }
    }

    try {
      setStatus('جاري تحديث أسعار الصرف…');
      const res = await fetch(API, { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.result !== 'success' || !data.rates) throw new Error('Bad API response');

      rates = data.rates;
      localStorage.setItem('currencyRatesCache', JSON.stringify({
        rates,
        updated: data.time_last_update_utc || new Date().toISOString()
      }));

      fillSelects(Object.keys(rates).sort());
      setStatus(`تم التحديث: ${data.time_last_update_utc || 'الآن'}`, true);
      convertFrom(activeIndex);
    } catch (err) {
      if (rates) {
        setStatus('تعذر تحديث الأسعار الآن؛ يتم استخدام آخر أسعار محفوظة على الجهاز.');
        convertFrom(activeIndex);
      } else {
        setStatus('تعذر تحميل أسعار الصرف. تأكد من اتصال الإنترنت ثم اضغط "تحديث أسعار الصرف".');
      }
    }
  }

  inputs.forEach((input, i) => {
    input.addEventListener('focus', () => activeIndex = i);
    input.addEventListener('input', () => convertFrom(i));
  });

  selects.forEach((select, i) => {
    select.addEventListener('change', () => {
      if (inputs[activeIndex].value.trim() === '') {
        const candidate = inputs.findIndex(x => x.value.trim() !== '');
        if (candidate !== -1) activeIndex = candidate;
      }
      convertFrom(activeIndex);
    });
  });

  refreshBtn.addEventListener('click', () => loadRates(true));

  fillSelects(fallbackCodes);
  selects.forEach((s,i) => s.value = defaults[i]);
  loadRates(false);
})();
</script>
</body>
</html>
